server.address=127.0.0.1
server.port=${APP_PORT:8471}
spring.datasource.url=jdbc:postgresql://127.0.0.1:55443/signuplab?connectTimeout=2&socketTimeout=3
spring.datasource.username=signuplab
spring.datasource.password=${DATABASE_PASSWORD:signuplab_dev}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=2500
spring.data.redis.host=127.0.0.1
spring.data.redis.port=56480
spring.data.redis.timeout=1500ms
spring.data.redis.connect-timeout=1500ms
spring.mail.host=127.0.0.1
spring.mail.port=11026
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=never
server.tomcat.accesslog.enabled=false
logging.level.root=WARN
lab.instance=${APP_INSTANCE:A}
lab.enabled=${LAB_ENABLED:false}
lab.key=${LAB_KEY:disabled}
lab.crypto=${SIGNUP_CRYPTO_KEY:disabled}
lab.oidc-secret=${OIDC_CLIENT_SECRET:disabled}
